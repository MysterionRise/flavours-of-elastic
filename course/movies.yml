# Films the course slides and exercises may name. Every id listed here is always
# part of `--size small` (see data/build_sample.py and data/sample.yml), so
# examples that mention them work on both dataset sizes.
#
# The dataset is MovieLens ml-32m up to 2002: nothing newer exists. Use the
# stand-ins below instead of the films in `not_in_dataset`. Hand-typed demo
# documents use string ids (demo-1, demo-2, ...) so they never overwrite a movie.
