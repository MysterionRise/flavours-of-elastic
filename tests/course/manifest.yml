---
# Which decks the course harness runs for each day, and the fixtures they need.
# Files run in order on a fresh stack (CI starts one per day and track).
days:
  1:
    files:
      - course/day1-fundamentals/day1-slides.md
      - course/day1-fundamentals/day1-exercises.md
      - course/solutions/day1-solutions.md
    setup:
      - {kibana_sample: ecommerce}
  2:
    files:
      - course/day2-query-dsl/day2-slides.md
      - course/day2-query-dsl/day2-exercises.md
      - course/solutions/day2-solutions.md
    setup:
      - {load: small}
      - {kibana_sample: ecommerce}
  3:
    files:
      - course/day3-indexing-analysis/day3-slides.md
      - course/day3-indexing-analysis/day3-exercises.md
    setup:
      - {load: small}
      - {kibana_sample: ecommerce}
  4:
    # Day 4 is rewritten for in-cluster E5 / ELSER in a later change; until then
    # its snippets (hand-pasted vectors, x86-only ELSER model ids) are not run.
    enabled: false
    files:
      - course/day4-semantic-search/day4-slides.md
      - course/day4-semantic-search/day4-exercises.md
    setup:
      - {load: small}
