---
# Elastic 9: one Elasticsearch 9.x node + Kibana over plain HTTP (9.x track, Days 1-3).
# Start: docker compose -f docker/elk-9/docker-compose.yml --env-file .env up -d --wait
services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK9_VERSION:?ELK9_VERSION is not set - pass --env-file .env}
    user: "0"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is not set - pass --env-file .env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?KIBANA_PASSWORD is not set - pass --env-file .env}
      SETUP_TIMEOUT: ${SETUP_TIMEOUT:-300}
    entrypoint: ["bash", "-euo", "pipefail", "-c"]
    command:
      - |
        deadline=$$((SECONDS + SETUP_TIMEOUT))
        es() { curl -s -o /dev/null -w '%{http_code}' -u "elastic:$${ELASTIC_PASSWORD}" "$$@" || true; }
        give_up() {
          echo "ERROR: $$1 (last HTTP status: $$2)" >&2
          if [ "$$2" = 401 ]; then
            echo "ELASTIC_PASSWORD is rejected. If the elastic password was changed inside the cluster," >&2
            echo "put it in .env, or reset the data (deletes it):" >&2
            echo "  docker compose -f docker/elk-9/docker-compose.yml --env-file .env down -v" >&2
          fi
          exit 1
        }
        health='http://elasticsearch-9:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
        echo "Waiting for Elasticsearch"
        until code=$$(es "$$health") && [ "$$code" = 200 ]; do
          [ "$$SECONDS" -lt "$$deadline" ] || give_up "Elasticsearch not ready after $${SETUP_TIMEOUT}s" "$$code"
          sleep 5
        done
        echo "Setting kibana_system password"
        until code=$$(es -X POST -H 'Content-Type: application/json' \
            http://elasticsearch-9:9200/_security/user/kibana_system/_password \
            -d "{\"password\":\"$${KIBANA_PASSWORD}\"}") && [ "$$code" = 200 ]; do
          [ "$$SECONDS" -lt "$$deadline" ] || give_up "could not set the kibana_system password" "$$code"
          sleep 5
        done
        echo "All done!"

  elasticsearch-9:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK9_VERSION:?ELK9_VERSION is not set - pass --env-file .env}
    environment:
      - node.name=elasticsearch-9
      - cluster.name=${CLUSTER_NAME:-elastic-cluster}
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is not set - pass --env-file .env}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=${LICENSE:-basic}
      - "ES_JAVA_OPTS=-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}"
    mem_limit: ${ES_MEM_LIMIT:-2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata9:/usr/share/elasticsearch/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ES_PORT:-9200}:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fs -u "elastic:$${ELASTIC_PASSWORD}"
          'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

  kibana-9:
    depends_on:
      setup:
        condition: service_completed_successfully
    image: docker.elastic.co/kibana/kibana:${ELK9_VERSION:?ELK9_VERSION is not set - pass --env-file .env}
    volumes:
      - kibanadata9:/usr/share/kibana/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KIBANA_PORT:-5601}:5601"
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch-9:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:?KIBANA_PASSWORD is not set - pass --env-file .env}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY (see .env.example)}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    mem_limit: ${KIBANA_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

volumes:
  esdata9:
    driver: local
  kibanadata9:
    driver: local
