            echo "ES01 logs:"
            docker compose -f docker/elk-ml/docker-compose.yml --env-file .env.example logs es01 --tail=50
            exit 1
          fi

      - name: Check cluster health
        run: |
          curl -k -f -u elastic:elastic https://localhost:9200/_cluster/health?pretty

      - name: Verify ML nodes are available
        run: |
          echo "Checking for ML-enabled nodes..."
          curl -k -f -u elastic:elastic https://localhost:9200/_cat/nodes?v
          if curl -k -s -u elastic:elastic https://localhost:9200/_nodes | grep -q '"ml"'; then
            echo "ML nodes found!"
          else
            echo "Warning: ML role not detected"
          fi

      - name: Test vector index creation
        run: |
          curl -k -f -X PUT "https://localhost:9200/test-vector-index" \
            -u elastic:elastic \
            -H 'Content-Type: application/json' \
            -d '{
              "mappings": {
                "properties": {
                  "title": {"type": "text"},
                  "embedding": {
                    "type": "dense_vector",
                    "dims": 3,
                    "index": true,
                    "similarity": "cosine"
                  }
                }
              }
            }'

      - name: Add vector documents
        run: |
          curl -k -f -X POST "https://localhost:9200/test-vector-index/_bulk" \
            -u elastic:elastic \
            -H 'Content-Type: application/x-ndjson' \
            -d '{"index": {"_id": "1"}}
          {"title": "Document A", "embedding": [0.5, 0.5, 0.5]}
          {"index": {"_id": "2"}}
          {"title": "Document B", "embedding": [0.1, 0.9, 0.1]}
          '

      - name: Test kNN query
        run: |
          sleep 2
          curl -k -f -X POST "https://localhost:9200/test-vector-index/_search" \
            -u elastic:elastic \
            -H 'Content-Type: application/json' \
            -d '{
              "knn": {
                "field": "embedding",
                "query_vector": [0.5, 0.5, 0.5],
                "k": 2,
                "num_candidates": 10
              }
            }'

      - name: Check Kibana
        run: |
          echo "Waiting for Kibana..."
          for i in {1..40}; do
            if curl -s -I http://localhost:5601 | grep -q "HTTP"; then
              echo "Kibana is responding!"
              break
            fi
            echo "Attempt $i/40: Waiting..."
            sleep 10
          done

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f docker/elk-ml/docker-compose.yml --env-file .env.example logs

      - name: Cleanup
        if: always()
