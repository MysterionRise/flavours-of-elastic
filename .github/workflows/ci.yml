---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:  # all PRs, including ones stacked on other branches
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install -r requirements-dev.txt

      - name: Run all pre-commit hooks
        # gitleaks only scans staged changes; the Secret Scan job covers CI.
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  unit:
    name: Unit Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan new commits with gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Scan only the commits this push / PR introduces; manual runs scan
          # the full history (historical findings live in .gitleaksignore).
          zero="0000000000000000000000000000000000000000"
          log_opts=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_opts="${PR_BASE}..${GITHUB_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ]; then
            log_opts="${PUSH_BEFORE}..${GITHUB_SHA}"
          fi
          set -- git --redact --no-banner --verbose
          if [ -n "$log_opts" ]; then
            set -- "$@" --log-opts="$log_opts"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 "$@" .

  compose-config:
    name: Compose Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Check every docker compose stack
        run: |
          docker compose version
          python -m scripts.check_compose --env-file .env.example

  test-elk-single:
    name: Test Elastic Single Stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, unit, compose-config]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set vm.max_map_count
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start Elastic Single cluster
        run: |
          docker compose -f docker/elk-single/docker-compose.yml --env-file .env.example up -d

      - name: Wait for cluster to be ready
        run: |
          echo "Waiting for Elasticsearch to be ready..."
          for i in {1..60}; do
            if curl -s -u elastic:elastic http://localhost:9200 | grep -q "cluster_name"; then
              echo "Elasticsearch is ready!"
              break
            fi
            echo "Attempt $i/60: Waiting..."
            sleep 5
          done

      - name: Check cluster health
        run: |
          curl -f -u elastic:elastic http://localhost:9200/_cluster/health?pretty

      - name: Create test index
        run: |
          curl -f -X PUT "http://localhost:9200/test-index" \
            -u elastic:elastic \
            -H 'Content-Type: application/json'

      - name: Add test document
        run: |
          curl -f -X POST "http://localhost:9200/test-index/_doc/1" \
            -u elastic:elastic \
            -H 'Content-Type: application/json' \
            -d '{"title": "CI Test", "timestamp": "2025-01-01"}'

      - name: Search documents
        run: |
          curl -f -u elastic:elastic "http://localhost:9200/test-index/_search?q=CI"

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Load checked-in movie data
        run: |
          python data/load_data.py --dataset movies --size small \
            --url http://localhost:9200 \
            --user elastic \
            --password elastic

      - name: Verify movie data count
        run: |
          curl -f -u elastic:elastic "http://localhost:9200/movies/_count"

      - name: Load deterministic embedding data
        run: |
          python data/load_data.py --dataset movies --size small --with-embeddings \
            --url http://localhost:9200 \
            --user elastic \
            --password elastic

      - name: Run evaluation smoke test
        run: |
          python search/evaluate.py --mode bm25,dense --queries evaluation/movie_queries.yml

      - name: Check Kibana
        run: |
          echo "Waiting for Kibana..."
          for i in {1..30}; do
            if curl -s -I http://localhost:5601 | grep -q "HTTP"; then
              echo "Kibana is responding!"
              break
            fi
            echo "Attempt $i/30: Waiting..."
            sleep 5
          done

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f docker/elk-single/docker-compose.yml --env-file .env.example logs

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker/elk-single/docker-compose.yml --env-file .env.example down -v

