---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:  # all PRs, including ones stacked on other branches
  schedule:
    - cron: '17 3 * * *'  # nightly: catches upstream image changes; full-history secret scan
  workflow_dispatch:
    inputs:
      stack:
        description: Only validate this stack (blank = all)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install -r requirements-dev.txt

      - name: Run all pre-commit hooks
        # gitleaks only scans staged changes; the Secret Scan job covers CI.
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  unit:
    name: Unit Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan new commits with gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Scan only the commits this push / PR introduces; manual runs scan
          # the full history (historical findings live in .gitleaksignore).
          zero="0000000000000000000000000000000000000000"
          log_opts=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_opts="${PR_BASE}..${GITHUB_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ]; then
            log_opts="${PUSH_BEFORE}..${GITHUB_SHA}"
          fi
          set -- git --redact --no-banner --verbose
          if [ -n "$log_opts" ]; then
            set -- "$@" --log-opts="$log_opts"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 "$@" .

  compose-config:
    name: Compose Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Check every docker compose stack
        run: |
          docker compose version
          python -m scripts.check_compose --env-file .env.example

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stacks: ${{ steps.matrix.outputs.stacks }}
      course: ${{ steps.matrix.outputs.course }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the stack matrix from the registry
        id: matrix
        env:
          ONLY: ${{ github.event.inputs.stack }}
        run: |
          python validate.py --list --json --env-file .env.example > "$RUNNER_TEMP/stacks.json"
          stacks=$(python - <<'PY'
          import json, os
          only = os.environ.get("ONLY", "")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "stacks.json")) as handle:
              stacks = json.load(handle)
          print(json.dumps([s["name"] for s in stacks if s["ci"] and only in ("", s["name"])]))
          PY
          )
          course=$(python - <<'PY'
          import json, os, pathlib
          only = os.environ.get("ONLY", "")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "stacks.json")) as handle:
              stacks = json.load(handle)
          manifest = pathlib.Path("tests/course/manifest.yml")
          enabled = set()
          if manifest.exists():
              import yaml
              days = yaml.safe_load(manifest.read_text())["days"]
              enabled = {int(day) for day, spec in days.items() if spec.get("enabled", True)}
          cells = [
              {"stack": s["name"], "day": day}
              for s in stacks
              if s["ci"] and only in ("", s["name"])
              for day in s["course_days"]
              if day in enabled
          ]
          print(json.dumps(cells))
          PY
          )
          {
            echo "stacks=$stacks"
            echo "course=$course"
          } >> "$GITHUB_OUTPUT"
          echo "Stacks: $stacks"
          echo "Course cells: $course"

  stacks:
    name: Stack / ${{ matrix.stack }}
    needs: [plan, lint, unit, compose-config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.plan.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set vm.max_map_count
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Validate stack
        run: >-
          python validate.py --stack "${{ matrix.stack }}" --env-file .env.example
          --logs-dir "$RUNNER_TEMP/logs"

      - name: Data and search smoke test
        run: >-
          python -m scripts.with_stack "${{ matrix.stack }}" --env-file .env.example
          --logs-dir "$RUNNER_TEMP/logs" -- python -m scripts.smoke_data

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: logs-${{ matrix.stack }}
          path: ${{ runner.temp }}/logs
          retention-days: 7

  course:
    name: Course Day ${{ matrix.day }} / ${{ matrix.stack }}
    needs: [plan, lint, unit, compose-config]
    if: needs.plan.outputs.course != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.course) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set vm.max_map_count
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Run the course snippets
        run: >-
          python -m scripts.with_stack "${{ matrix.stack }}" --env-file .env.example
          --logs-dir "$RUNNER_TEMP/logs" --
          python -m tests.course.run --day "${{ matrix.day }}" --stack "${{ matrix.stack }}"

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: logs-course-day${{ matrix.day }}-${{ matrix.stack }}
          path: ${{ runner.temp }}/logs
          retention-days: 7

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, unit, secrets, compose-config, plan, stacks, course]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job finished with: $result"; exit 1 ;;
            esac
          done
          echo "All required jobs passed: $RESULTS"
