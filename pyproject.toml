[tool.ruff]
# Formatter width matches what black produced (black's default of 88);
# the lint limit below keeps flake8's previous 120-column ceiling.
line-length = 88
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["search", "data", "apps", "tests"]
